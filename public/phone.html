<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exposure phone preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2325; font-family: system-ui, sans-serif; }
  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 32px; padding: 24px; box-sizing: border-box; }
  .phone { width: 393px; height: 852px; transform: scale(.92); transform-origin: center; border-radius: 54px; background: #000; padding: 12px; box-sizing: border-box; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 2px #2a2a2e; position: relative; flex: none; }
  .screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #0B0B0C; position: relative; }
  .island { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 2; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .nav { display: flex; flex-direction: column; gap: 8px; }
  .nav a { color: #A8A299; text-decoration: none; font-size: 14px; padding: 8px 12px; border-radius: 999px; background: #141416; }
  .nav a:hover { color: #FFB020; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="screen"><iframe id="app" src="/" title="Exposure"></iframe></div></div>
  <nav class="nav" aria-label="Jump to screen">
    <a href="#" data-path="/onboarding">Onboarding</a>
    <a href="#" data-path="/">Rolls</a>
    <a href="#" data-path="/roll/sample">Sample roll</a>
    <a href="#" data-path="/stocks">Stocks</a>
    <a href="#" data-path="/new-roll">New roll</a>
    <a href="#" data-path="/prints">Prints</a>
    <a href="#" data-path="/paywall">Paywall</a>
    <a href="#" data-path="/out-of-credits">Out of credits</a>
    <a href="#" data-path="/settings">Settings</a>
  </nav>
</div>
<script>
  const initial = new URLSearchParams(location.search).get('p');
  if (initial && initial.startsWith('/')) document.getElementById('app').src = initial;
  document.querySelectorAll('[data-path]').forEach((a) => a.addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('app').src = a.dataset.path;
  }));
</script>
</body>
</html>
